name: build.yml

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            objects.githubusercontent.com:443

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          submodules: recursive

      - name: Install CMake/Ninja
        uses: lukka/get-cmake@6b3e96a9bc9976b8b546346fdd102effedae0ca8 # v4.0.3

      - name: Prepare libressl
        run: cd libressl && ./update.sh

      - name: Run build
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release -B cmake-build-release
          cmake --build cmake-build-release -j 4

      - name: Run tests
        run: cmake-build-release/ts3idtests

      - name: Archive artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          path: cmake-build-release/ts3id*
